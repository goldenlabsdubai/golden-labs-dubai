# Golden Labs frontend (static dist/) — paste into your server block for goldenlabs.finance
# Required so refresh on /subscription, /mint, /marketplace, /dashboard, /leaderboard works.

server {
    listen 443 ssl http2;
    server_name goldenlabs.finance www.goldenlabs.finance;

    root /var/www/goldenlabs/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
